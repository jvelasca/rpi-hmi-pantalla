<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=480, height=320, initial-scale=1.0, user-scalable=no">
    <title>Raspberry HMI Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 480px;
            height: 320px;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 8px;
            gap: 6px;
        }

        /* ── Header ──────────────────────────────── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            background: #16213e;
            border-radius: 8px;
            height: 36px;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 16px;
            color: #e94560;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-connected {
            background: #00ff88;
            box-shadow: 0 0 6px #00ff88;
        }

        .status-disconnected {
            background: #ff4444;
            box-shadow: 0 0 6px #ff4444;
        }

        .connection-status {
            font-size: 11px;
            color: #aaa;
        }

        /* ── Main content ────────────────────────── */
        .main {
            display: flex;
            flex: 1;
            gap: 8px;
            min-height: 0;
        }

        /* ── LED Panel (izquierda) ───────────────── */
        .led-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #16213e;
            border-radius: 12px;
            gap: 12px;
        }

        .led-label {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 2px;
        }

        .led-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            transition: all 0.3s ease;
            position: relative;
        }

        .led-off {
            background: radial-gradient(circle at 35% 35%, #444, #1a1a1a);
            border: 3px solid #333;
            box-shadow:
                0 0 10px rgba(0,0,0,0.5),
                inset 0 0 20px rgba(0,0,0,0.3);
        }

        .led-on {
            background: radial-gradient(circle at 35% 35%, #ff4444, #990000);
            border: 3px solid #ff6666;
            box-shadow:
                0 0 25px rgba(255,0,0,0.7),
                0 0 50px rgba(255,0,0,0.3),
                inset 0 0 30px rgba(255,100,100,0.2);
            animation: led-pulse 2s ease-in-out infinite;
        }

        @keyframes led-pulse {
            0%, 100% {
                box-shadow:
                    0 0 25px rgba(255,0,0,0.7),
                    0 0 50px rgba(255,0,0,0.3),
                    inset 0 0 30px rgba(255,100,100,0.2);
            }
            50% {
                box-shadow:
                    0 0 40px rgba(255,0,0,0.9),
                    0 0 70px rgba(255,0,0,0.4),
                    inset 0 0 40px rgba(255,150,150,0.2);
            }
        }

        .led-status {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .led-status.off { color: #666; }
        .led-status.on { color: #ff6666; }

        .led-toggle {
            background: #0f3460;
            color: #e0e0e0;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .led-toggle:active {
            background: #e94560;
        }

        /* ── Button Panel (derecha) ──────────────── */
        .button-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #16213e;
            border-radius: 12px;
            gap: 10px;
        }

        .button-label {
            font-size: 13px;
            color: #aaa;
            letter-spacing: 2px;
        }

        .big-button {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: none;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
            letter-spacing: 1px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .big-button.ready {
            background: linear-gradient(135deg, #0f3460, #1a4a8a);
            border: 3px solid #2a6090;
            box-shadow:
                0 6px 20px rgba(0,0,0,0.3),
                inset 0 2px 4px rgba(255,255,255,0.1);
        }

        .big-button.pressed {
            background: linear-gradient(135deg, #00cc66, #009944);
            border: 3px solid #00ff88;
            box-shadow:
                0 2px 8px rgba(0,255,136,0.4),
                inset 0 4px 8px rgba(0,0,0,0.2);
            transform: scale(0.95);
        }

        .big-button:active {
            transform: scale(0.93);
        }

        .press-counter {
            font-size: 12px;
            color: #888;
            text-align: center;
        }

        .press-counter span {
            color: #e94560;
            font-weight: bold;
            font-size: 16px;
        }

        /* ── Footer ──────────────────────────────── */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 12px;
            font-size: 10px;
            color: #555;
            flex-shrink: 0;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>RPi HMI Panel</h1>
            <div class="connection-status">
                <span id="status-dot" class="status-dot status-disconnected"></span>
                <span id="status-text">Desconectado</span>
            </div>
        </div>

        <!-- Main -->
        <div class="main">
            <!-- LED Panel -->
            <div class="led-panel">
                <div class="led-label">LED 1</div>
                <div id="led-circle" class="led-circle led-off"></div>
                <div id="led-status" class="led-status off">APAGADO</div>
                <button id="led-toggle" class="led-toggle">Encender</button>
            </div>

            <!-- Button Panel -->
            <div class="button-panel">
                <div class="button-label">BOTÓN</div>
                <button id="big-button" class="big-button ready">PULSAR</button>
                <div class="press-counter">
                    Pulsaciones: <span id="press-count">0</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>v1.0</span>
            <span id="ws-info">WS: --</span>
            <span id="time"></span>
        </div>
    </div>

    <script>
        // ── Estado ──────────────────────────────────────
        let ledOn = false;
        let buttonPressed = false;
        let pressCount = 0;
        let ws = null;
        let wsReconnectTimer = null;

        // ── DOM references ──────────────────────────────
        const ledCircle = document.getElementById('led-circle');
        const ledStatus = document.getElementById('led-status');
        const ledToggle = document.getElementById('led-toggle');
        const bigButton = document.getElementById('big-button');
        const pressCountEl = document.getElementById('press-count');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const wsInfo = document.getElementById('ws-info');
        const timeEl = document.getElementById('time');

        // ── Determinar host del WebSocket ───────────────
        const wsHost = window.location.hostname || 'localhost';
        const wsPort = '8001';
        const wsUrl = `ws://${wsHost}:${wsPort}/ws`;

        // ── Conectar WebSocket ──────────────────────────
        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            wsInfo.textContent = 'WS: conectando...';
            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    console.log('WebSocket conectado');
                    wsInfo.textContent = 'WS: OK';
                    updateConnectionStatus(true);
                    if (wsReconnectTimer) {
                        clearTimeout(wsReconnectTimer);
                        wsReconnectTimer = null;
                    }
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        handleMessage(msg);
                    } catch (e) {
                        console.error('Error parseando mensaje:', e);
                    }
                };

                ws.onclose = () => {
                    console.log('WebSocket desconectado');
                    wsInfo.textContent = 'WS: caído';
                    updateConnectionStatus(false);
                    scheduleReconnect();
                };

                ws.onerror = (err) => {
                    console.error('WebSocket error:', err);
                    wsInfo.textContent = 'WS: error';
                };

            } catch (e) {
                console.error('Error creando WebSocket:', e);
                scheduleReconnect();
            }
        }

        function scheduleReconnect() {
            if (wsReconnectTimer) return;
            wsReconnectTimer = setTimeout(() => {
                wsReconnectTimer = null;
                connectWebSocket();
            }, 3000);
        }

        function updateConnectionStatus(connected) {
            if (connected) {
                statusDot.className = 'status-dot status-connected';
                statusText.textContent = 'Conectado';
            } else {
                statusDot.className = 'status-dot status-disconnected';
                statusText.textContent = 'Desconectado';
            }
        }

        // ── Manejar mensajes del servidor ──────────────
        function handleMessage(msg) {
            switch (msg.type) {
                case 'status':
                    updateLED(msg.led);
                    pressCount = msg.button_press_count || 0;
                    pressCountEl.textContent = pressCount;
                    break;

                case 'led_state':
                    updateLED(msg.state);
                    break;

                case 'button_press':
                    pressCount = msg.press_count || pressCount + 1;
                    pressCountEl.textContent = pressCount;
                    showButtonPressed();
                    break;

                case 'button_release':
                    pressCount = msg.press_count || pressCount;
                    pressCountEl.textContent = pressCount;
                    showButtonReleased();
                    break;

                case 'error':
                    console.warn('Error del servidor:', msg.message);
                    break;
            }
        }

        // ── Funciones de UI ────────────────────────────
        function updateLED(state) {
            ledOn = state;
            if (ledOn) {
                ledCircle.className = 'led-circle led-on';
                ledStatus.className = 'led-status on';
                ledStatus.textContent = 'ENCENDIDO';
                ledToggle.textContent = 'Apagar';
            } else {
                ledCircle.className = 'led-circle led-off';
                ledStatus.className = 'led-status off';
                ledStatus.textContent = 'APAGADO';
                ledToggle.textContent = 'Encender';
            }
        }

        function toggleLED() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'toggle_led' }));
            } else {
                // Fallback: llamada REST
                fetch('/api/led/toggle', { method: 'POST' })
                    .then(r => r.json())
                    .then(data => updateLED(data.state))
                    .catch(err => console.error('Error toggling LED:', err));
            }
        }

        function showButtonPressed() {
            bigButton.className = 'big-button pressed';
            bigButton.textContent = 'PULSADO';
            setTimeout(showButtonReleased, 300);
        }

        function showButtonReleased() {
            bigButton.className = 'big-button ready';
            bigButton.textContent = 'PULSAR';
        }

        function pressButton() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'button_press' }));
            } else {
                // Fallback: llamada REST
                fetch('/api/button/press', { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        pressCount = data.press_count;
                        pressCountEl.textContent = pressCount;
                    })
                    .catch(err => console.error('Error pressing button:', err));
            }
            showButtonPressed();
        }

        // ── Eventos ────────────────────────────────────
        ledToggle.addEventListener('click', toggleLED);

        bigButton.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            pressButton();
        });

        bigButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pressButton();
        });

        // ── Reloj ───────────────────────────────────────
        function updateTime() {
            const now = new Date();
            timeEl.textContent = now.toLocaleTimeString('es-ES', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        setInterval(updateTime, 1000);
        updateTime();

        // ── Init ────────────────────────────────────────
        connectWebSocket();

        // Obtener estado inicial vía REST como fallback
        fetch('/api/status')
            .then(r => r.json())
            .then(data => {
                updateLED(data.led.state);
                pressCount = data.button.press_count;
                pressCountEl.textContent = pressCount;
            })
            .catch(err => console.error('Error obteniendo estado:', err));
    </script>
</body>
</html>
