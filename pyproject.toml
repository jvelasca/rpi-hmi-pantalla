[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-hmi"
version = "0.3.4"
description = "Raspberry Pi HMI — Panel de control táctil industrial"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "RPi HMI Team"},
]
keywords = ["raspberry-pi", "hmi", "fastapi", "iot", "industrial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "display/tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
norecursedirs = [".venv", "venv", "node_modules", ".git", "__pycache__"]
markers = [
    "hardware: test que requiere Raspberry Pi fisica (HIL). Se salta en entornos sin hardware.",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true
