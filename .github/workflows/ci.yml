name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install SDL2 (pygame dependency)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-2.0-0 libsdl2-ttf-2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r display/requirements.txt

      - name: Run backend + display tests
        run: python -m pytest backend/tests/ display/tests/ -v --tb=short

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.3

      - name: Run ruff check
        run: ruff check backend/ display/ scripts/ --config backend/pyproject.toml

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r display/requirements.txt

      - name: Run mypy
        run: |
          cd backend
          python -m mypy app/ --config-file pyproject.toml

  security:
    name: Security audit (pip-audit + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r display/requirements.txt

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          # Audita el fichero de requisitos; si pip-audit falla (p. ej. por la
          # versión de Python en uso), cae al modo sin argumentos que audita el
          # entorno ya instalado.
          pip-audit -r backend/requirements.txt || pip-audit

      - name: Run bandit static security analysis
        run: |
          pip install bandit
          # --severity-level medium: solo se bloquea el CI con hallazgos de
          # severidad media o alta; los de severidad baja se informan pero no
          # impiden el merge. Se excluyen los tests de backend y display.
          bandit -r backend/app display --exclude backend/tests,display/tests -q --severity-level medium

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Audit npm dependencies
        run: |
          cd frontend
          # Falla solo con vulnerabilidades altas/críticas; las moderadas no bloquean.
          npm audit --audit-level=high

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  release-smoke:
    name: Release Smoke Test
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Verify required files exist
        run: |
          echo "=== Checking required files ==="
          for f in \
            VERSION \
            backend/app/main.py \
            backend/config/devices.yaml \
            display/app.py \
            frontend/dist/index.html \
            config/systemd/rpi-hmi-backend.service \
            config/systemd/rpi-hmi-display.service
          do
            if [ -f "$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [FAIL] $f MISSING"
              exit 1
            fi
          done

      - name: Verify forbidden files do NOT exist
        run: |
          echo "=== Checking forbidden files ==="
          # __pycache__ directories
          if find . -type d -name '__pycache__' | grep -q .; then
            echo "  [FAIL] __pycache__ directories found"
            find . -type d -name '__pycache__'
            exit 1
          fi
          echo "  [OK] No __pycache__ directories"

          # .pyc files
          if find . -name '*.pyc' | grep -q .; then
            echo "  [FAIL] .pyc files found"
            find . -name '*.pyc'
            exit 1
          fi
          echo "  [OK] No .pyc files"

          # .env files
          if find . -name '.env' -not -name '.env.example' | grep -q .; then
            echo "  [FAIL] .env files found"
            find . -name '.env' -not -name '.env.example'
            exit 1
          fi
          echo "  [OK] No .env files"

          # frontend/Untitled
          if [ -d "frontend/Untitled" ] || [ -f "frontend/Untitled" ]; then
            echo "  [FAIL] frontend/Untitled found"
            exit 1
          fi
          echo "  [OK] No frontend/Untitled"

      - name: Validate VERSION is valid semver
        run: |
          echo "=== Validating VERSION ==="
          VERSION=$(cat VERSION)
          echo "  VERSION = $VERSION"
          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "  [OK] Valid semver: $VERSION"
          else
            echo "  [FAIL] Invalid semver: $VERSION"
            exit 1
          fi
