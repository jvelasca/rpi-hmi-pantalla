name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-2.0-0 libsdl2-ttf-2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r display/requirements.txt

      - name: Run tests
        run: python -m pytest backend/tests/ display/tests/ -v --tb=short

  release:
    name: Build and release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run test
          npm run build

      - name: Create release archive
        run: |
          mkdir -p release-artifacts
          cp -r frontend/dist release-artifacts/frontend
          cp -r backend release-artifacts/backend
          cp -r display release-artifacts/display
          cp -r config release-artifacts/config
          cp -r scripts release-artifacts/scripts
          cp VERSION README.md LICENSE release-artifacts/ 2>/dev/null || true
          cd release-artifacts
          tar -czf ../rpi-hmi-${{ github.ref_name }}.tar.gz .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rpi-hmi-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
